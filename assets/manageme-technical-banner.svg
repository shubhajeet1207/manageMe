<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">ManageMe — a private career workspace</title>
  <desc id="desc">A graphite, coral, and teal technical banner. An application, resume, documents, and follow-up tasks connect through a career pipeline to a progress view.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171427"/><stop offset="1" stop-color="#0d111d"/></linearGradient>
    <radialGradient id="warm-light"><stop stop-color="#f05b43" stop-opacity=".13"/><stop offset="1" stop-color="#f05b43" stop-opacity="0"/></radialGradient>
    <radialGradient id="cool-light"><stop stop-color="#83d5ce" stop-opacity=".11"/><stop offset="1" stop-color="#83d5ce" stop-opacity="0"/></radialGradient>
    <linearGradient id="focus-card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4a2b36"/><stop offset="1" stop-color="#211e32"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b9b3c9" stroke-opacity=".055"/></pattern>
    <marker id="arrow-coral" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#ef8d7b" stroke-width="1.4"/></marker>
    <marker id="arrow-teal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#83d5ce" stroke-width="1.4"/></marker>
  </defs>
  <rect width="1600" height="600" rx="24" fill="url(#background)"/>
  <rect x="1" y="1" width="1598" height="598" rx="23" fill="url(#grid)" stroke="#373043"/>
  <ellipse cx="1120" cy="170" rx="500" ry="320" fill="url(#warm-light)"/><ellipse cx="1390" cy="410" rx="270" ry="210" fill="url(#cool-light)"/>
  <g font-family="'Segoe UI', Arial, sans-serif">
    <g transform="translate(80 47)" fill="none" stroke="#f5806a" stroke-width="2" stroke-linejoin="round"><rect x="0" y="0" width="34" height="30" rx="2"/><path d="M7 9h20M7 15h14M7 21h9"/><path d="M40 8h10M40 15h14M40 22h8" stroke="#83d5ce"/></g>
    <text x="156" y="76" fill="#c5bccf" font-family="Consolas, monospace" font-size="16" letter-spacing="3">PERSONAL CAREER SYSTEM</text><text x="1520" y="76" text-anchor="end" fill="#b8afc4" font-family="Consolas, monospace" font-size="14" letter-spacing="2">CALM WORKSPACE / CLEAR NEXT MOVE</text>
    <text x="76" y="205" fill="#fff4e7" font-size="100" font-weight="700" letter-spacing="-5">ManageMe</text><text x="81" y="271" fill="#f5806a" font-size="42" font-weight="400" letter-spacing="1">Career workspace</text><text x="82" y="338" fill="#fff4e7" font-size="28" font-weight="600">Keep every opportunity connected.</text><text x="82" y="376" fill="#bdb5cc" font-size="28">Make the next move obvious.</text>
    <g transform="translate(82 419)" font-family="Consolas, monospace" font-size="15"><rect width="156" height="36" rx="8" fill="#252133" stroke="#494052"/><text x="78" y="24" text-anchor="middle" fill="#e4d9ec">APPLICATIONS</text><rect x="170" width="113" height="36" rx="8" fill="#252133" stroke="#494052"/><text x="226.5" y="24" text-anchor="middle" fill="#e4d9ec">FILES</text><rect x="297" width="124" height="36" rx="8" fill="#252133" stroke="#494052"/><text x="359" y="24" text-anchor="middle" fill="#e4d9ec">PROGRESS</text></g>
    <!-- Abstract career-work circuit; it illustrates product relationships, not a UI screenshot. -->
    <g transform="translate(850 108)">
      <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M160 92h32q16 0 16 16v57q0 16 16 16h16" stroke="#ef8d7b" marker-end="url(#arrow-coral)"/><path d="M160 270h32q16 0 16-16v-28q0-16 16-16h16" stroke="#ef8d7b" marker-end="url(#arrow-coral)"/><path d="M404 180h28q16 0 16-16v-62q0-16 16-16h26" stroke="#83d5ce" marker-end="url(#arrow-teal)"/><path d="M570 140v90" stroke="#83d5ce" marker-end="url(#arrow-teal)"/><path d="M490 285h-30q-12 0-12 12v43q0 18-18 18H80q-16 0-16-16v-22" stroke="#6f657e" stroke-dasharray="5 8"/></g>
      <circle cx="208" cy="136" r="4" fill="#f5806a"/><circle cx="448" cy="136" r="4" fill="#83d5ce"/><circle cx="570" cy="183" r="4" fill="#83d5ce"/>
      <g transform="translate(0 40)"><rect width="160" height="100" rx="14" fill="#211e30" stroke="#494052"/><g transform="translate(20 18)" fill="none" stroke="#d4c6e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="33" height="29" rx="3"/><path d="M7 9h19M7 16h13M7 23h8"/><path d="m42 22 5 5 10-12" stroke="#ef8d7b"/></g><text x="20" y="78" fill="#e8dfea" font-family="Consolas, monospace" font-size="15">ROLE CARD</text><text x="140" y="33" text-anchor="end" fill="#a79bb6" font-family="Consolas, monospace" font-size="12">01</text></g>
      <g transform="translate(0 220)"><rect width="160" height="100" rx="14" fill="#211e30" stroke="#494052"/><g transform="translate(22 14)" fill="none" stroke="#d4c6e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0h20l10 10v29H0Z"/><path d="M20 0v11h10M7 21h16M7 29h11"/><path d="M40 12h16M40 20h11M40 28h14" stroke="#83d5ce"/></g><text x="20" y="78" fill="#e8dfea" font-family="Consolas, monospace" font-size="15">FILES + NOTES</text><text x="140" y="33" text-anchor="end" fill="#a79bb6" font-family="Consolas, monospace" font-size="12">02</text></g>
      <g transform="translate(240 130)"><rect x="-8" y="-8" width="180" height="136" rx="24" fill="none" stroke="#f5806a" stroke-opacity=".16"/><rect width="164" height="120" rx="18" fill="url(#focus-card)" stroke="#ef8d7b" stroke-width="1.5"/><g transform="translate(51 17)" fill="none" stroke="#ffb09c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M0 18h13l7-10 8 16 7-8h18"/><circle cx="0" cy="18" r="3"/><circle cx="20" cy="8" r="3"/><circle cx="28" cy="24" r="3"/><circle cx="42" cy="16" r="3"/><circle cx="53" cy="16" r="3"/></g><text x="82" y="87" text-anchor="middle" fill="#fff4e7" font-size="17" font-weight="600">Follow through</text><text x="82" y="106" text-anchor="middle" fill="#e4b3ab" font-family="Consolas, monospace" font-size="11" letter-spacing="1">TASKS + PIPELINE</text></g>
      <g transform="translate(490 30)"><rect width="160" height="110" rx="14" fill="#18272e" stroke="#416068"/><g transform="translate(20 17)" fill="none" stroke="#83d5ce" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 62V4h120v58Z"/><path d="M13 49 42 30l22 12 38-28"/><path d="M96 14h13M96 23h13"/><circle cx="13" cy="49" r="2" fill="#83d5ce"/><circle cx="42" cy="30" r="2" fill="#83d5ce"/><circle cx="64" cy="42" r="2" fill="#83d5ce"/></g><text x="20" y="95" fill="#c4f0eb" font-family="Consolas, monospace" font-size="14">PROGRESS</text></g>
      <g transform="translate(490 230)"><rect width="160" height="110" rx="14" fill="#211e30" stroke="#494052"/><g transform="translate(22 18)" fill="none" stroke="#d4c6e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="44" height="15" rx="3"/><path d="M8 7h28"/><path d="M0 31h52M0 43h40M0 55h47"/><path d="m60 9 6 6 13-15" stroke="#83d5ce"/></g><text x="20" y="95" fill="#e8dfea" font-family="Consolas, monospace" font-size="14">NEXT ACTION</text></g>
    </g>
  </g>
</svg>
